<ion-content [fullscreen]="true" class="booking-page">
  <div class="booking-shell">

    <!-- 1. Back -->
    <div class="top-bar">
      <button class="icon-btn" type="button" aria-label="Back" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
    </div>

    <h1 class="stay-title">{{ destinationName }}</h1>

    <!-- 2. Check-in / check-out -->
    <div class="date-header">
      <div class="date-box">
        <span class="label">Check in</span>
        <input type="date" aria-label="Check in date" [(ngModel)]="checkIn" (ngModelChange)="onCheckInChange()" />
      </div>
      <div class="date-box">
        <span class="label">Check out</span>
        <input type="date" aria-label="Check out date" [(ngModel)]="checkOut" (ngModelChange)="onCheckOutChange()" />
      </div>
    </div>

    <!-- 3. Calendar -->
    <div class="calendar-panel">
      <div class="month-row">
        <button class="nav-btn" type="button" aria-label="Previous month" (click)="prevMonth()">&#8249;</button>
        <span>{{ monthLabel }}</span>
        <button class="nav-btn" type="button" aria-label="Next month" (click)="nextMonth()">&#8250;</button>
      </div>

      <div class="weekdays">
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
      </div>

      <div class="calendar-grid">
        <button
          *ngFor="let cell of calendarCells"
          type="button"
          [class]="dayClass(cell)"
          [attr.aria-label]="cell.date | date: 'MMM d, y'"
          (click)="onDayClick(cell)"
        >{{ cell.day }}</button>
      </div>
    </div>

    <!-- 4. Total (left) + Continue (right) -->
    <div class="action-row">
      <div class="total-block">
        <span class="total-label">{{ staySummary }} &middot; {{ nightlyRate | currency: 'PHP' : 'symbol' : '1.0-0' }}/night</span>
        <span class="total-value">{{ totalCost | currency: 'PHP' : 'symbol' : '1.0-0' }}</span>
      </div>
      <button class="primary-btn" type="button" [disabled]="nights === 0" (click)="proceedToPayment()">
        Continue
      </button>
    </div>

  </div>
</ion-content>
