<ion-content class="sub-content" [fullscreen]="true">
  <div class="sub-shell">

    <div class="top-bar">
      <button class="icon-btn" type="button" (click)="goBack()" aria-label="Back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <button class="link-btn" type="button" (click)="showPasswords.set(!showPasswords())">
        <ion-icon [name]="showPasswords() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        {{ showPasswords() ? 'Hide' : 'Show' }} passwords
      </button>
    </div>

    <h1 class="page-title">Change password</h1>
    <p class="page-subtitle">Use at least 6 characters, and something you don't use elsewhere.</p>

    <form class="card" (ngSubmit)="save()" novalidate>
      <div class="field">
        <label for="current">Current password</label>
        <input
          id="current"
          name="current"
          autocomplete="current-password"
          [type]="showPasswords() ? 'text' : 'password'"
          [(ngModel)]="current"
        />
      </div>

      <div class="field">
        <label for="next">New password</label>
        <input
          id="next"
          name="next"
          autocomplete="new-password"
          [type]="showPasswords() ? 'text' : 'password'"
          [(ngModel)]="next"
        />
      </div>

      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input
          id="confirm"
          name="confirm"
          autocomplete="new-password"
          [type]="showPasswords() ? 'text' : 'password'"
          [(ngModel)]="confirm"
        />
      </div>

      <p class="notice" [class.ok]="success()" *ngIf="message()" role="alert">{{ message() }}</p>

      <button class="primary-btn" type="submit" [disabled]="busy()">
        {{ busy() ? 'Saving...' : 'Update password' }}
      </button>
    </form>

  </div>
</ion-content>
