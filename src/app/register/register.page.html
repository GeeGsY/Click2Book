<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-shell">

    <!-- 1. Logo -->
    <div class="logo" role="img" aria-label="Click2Book logo">
      <ion-icon name="location"></ion-icon>
    </div>

    <!-- 2. Sign-up form -->
    <form class="auth-card" (ngSubmit)="onSignUp()" novalidate>
      <label for="name">Name</label>
      <input
        id="name"
        name="name"
        type="text"
        autocomplete="name"
        placeholder="Your full name"
        [(ngModel)]="name"
      />

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="you@example.com"
        [(ngModel)]="email"
      />

      <label for="password">Password</label>
      <div class="input-wrap">
        <input
          id="password"
          name="password"
          autocomplete="new-password"
          placeholder="At least 6 characters"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
        />
        <button
          class="eye"
          type="button"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <p class="notice" *ngIf="message" role="alert">{{ message }}</p>

      <button class="primary-btn" type="submit" [disabled]="busy">
        {{ busy ? 'Creating account...' : 'Sign up' }}
      </button>

      <p class="switch">
        Already have an account?
        <button class="link-btn strong" type="button" (click)="onLogin()">Log in</button>
      </p>
    </form>

  </div>
</ion-content>
