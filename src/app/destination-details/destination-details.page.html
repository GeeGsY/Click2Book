<ion-content class="details-content" [fullscreen]="true">
  <div class="details-page">

    <!-- 1. Back + message the host -->
    <div class="top-bar">
      <button class="icon-btn" type="button" (click)="onBack()" aria-label="Back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <button class="icon-btn dark" type="button" (click)="onMessage()" aria-label="Message the host">
        <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
      </button>
    </div>

    <!-- 2. Main image -->
    <div class="hero-image" [style.background-image]="'url(' + destination.heroImage + ')'"></div>

    <!-- 3. Three preview images -->
    <div class="thumbnail-row">
      <button
        class="thumbnail"
        type="button"
        *ngFor="let img of destination.thumbnails; let i = index"
        [class.active]="i === activeImage"
        (click)="onSelectThumbnail(i)"
        [style.background-image]="'url(' + img + ')'"
        [attr.aria-label]="'View photo ' + (i + 1)"
      ></button>
    </div>

    <!-- 4. Name + rating -->
    <div class="title-block">
      <h1>{{ destination.name }}, {{ destination.country }}</h1>
      <div class="rating-row">
        <ion-icon name="star"></ion-icon>
        <span class="rating-value">{{ destination.rating }}</span>
        <span class="review-count">({{ destination.reviewCount | number }} reviews)</span>
      </div>
    </div>

    <!-- 5. Description -->
    <div class="info-card">
      <p class="description">{{ destination.description }}</p>
    </div>

    <!-- 6. Price + book -->
    <div class="action-row">
      <div class="action-price">
        <span class="price">{{ destination.price | currency: 'PHP' : 'symbol' : '1.0-0' }}</span>
        <span class="price-unit">/ night</span>
      </div>
      <button class="book-btn" type="button" (click)="onBookNow()">Book now</button>
    </div>

  </div>
</ion-content>
