<ion-content [fullscreen]="true" class="payment-page">
  <div class="payment-shell">

    <!-- 1. Back -->
    <div class="top-bar">
      <button class="icon-btn" type="button" aria-label="Back" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
    </div>

    <!-- 2. Reservation details -->
    <p class="section-label">Reservation details</p>

    <div class="field">
      <label for="accommodation">Selected accommodation</label>
      <input id="accommodation" type="text" [value]="accommodationName" readonly />
    </div>

    <div class="field-row">
      <div class="field">
        <label for="total">Booking total</label>
        <input
          id="total"
          class="total-input"
          type="text"
          [value]="bookingTotal | currency: 'PHP' : 'symbol' : '1.0-0'"
          readonly
        />
      </div>

      <div class="field">
        <label for="discount">Discount code</label>
        <input id="discount" type="text" placeholder="PROMO10" [(ngModel)]="discountCode" />
      </div>
    </div>

    <!-- 3. Account / card details (changes with the chosen method) -->
    <div class="field">
      <label for="account">{{ accountNumberLabel }}</label>
      <input
        id="account"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        [attr.maxlength]="selectedPaymentMethod === 'card' ? 19 : 16"
        [placeholder]="accountNumberPlaceholder"
        [value]="accountNumber"
        (input)="onAccountNumberInput($event)"
      />
    </div>

    <div class="field-row" *ngIf="selectedPaymentMethod === 'card'">
      <div class="field">
        <label for="cvv">CVV / security code</label>
        <input
          id="cvv"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          maxlength="4"
          placeholder="123"
          [value]="securityCode"
          (input)="onSecurityCodeInput($event)"
        />
      </div>
    </div>

    <!-- 4. Payment method -->
    <p class="section-label methods-label">Select payment method</p>
    <div class="method-row">
      <button
        class="method-btn"
        type="button"
        *ngFor="let method of paymentMethods"
        [class.active]="method.id === selectedPaymentMethod"
        (click)="onSelectMethod(method.id)"
      >{{ method.label }}</button>
    </div>

    <!-- 5. Continue -->
    <div class="action-row">
      <button class="primary-btn" type="button" [disabled]="!canContinue" (click)="processPayment()">
        Continue
      </button>
    </div>

  </div>
</ion-content>
